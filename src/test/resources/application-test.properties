# Test configuration - H2 in-memory DB
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (optional, disable in CI)
spring.h2.console.enabled=false

# JWT
jwt.secret=test-secret-key-for-testing-purposes-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=900000
jwt.refresh-expiration=2592000000

# Email (Elastic Email - mock values for tests)
email.api.key=test-api-key-for-unit-tests
email.from.address=test@test.com
email.from.name=Lectuaria
platform.name=Lectuaria

# AWS S3 (mock)
aws.s3.endpoint=http://localhost:9000
aws.s3.region=us-east-1
aws.s3.access-key=test-key
aws.s3.secret-key=test-secret
aws.s3.bucket=lectuaria-test

# Logging
logging.level.root=WARN
logging.level.com.lectuaria=INFO