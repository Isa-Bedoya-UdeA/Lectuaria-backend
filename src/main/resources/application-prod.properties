# ============================================
# application-prod.properties
# Perfil de produccion
# ============================================

# Database - Supabase (la URL se obtiene unicamente desde la variable de entorno DB_URL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pooling configuration para Supabase
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# JPA/Hibernate - produccion: nunca se muestra SQL para evitar fuga de datos sensibles
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Logging minimo en produccion (no DEBUG ni TRACE para evitar filtrar SQL con valores)
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.springframework.security=INFO

# Transaction
spring.transaction.default-timeout=30

# Actuator: solo health check, sin detalle
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
