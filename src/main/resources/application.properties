# ============================================
# application.properties (base)
# ============================================
spring.application.name=lectuaria-backend
spring.profiles.active=dev
server.port=3000

# DataSource (valores por defecto, sobrescritos por perfil dev)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JDBC Properties - importante para PostgreSQL y PgBouncer
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true

# JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.jdbc.use_get_generated_keys=true
spring.jpa.open-in-view=false

# Cookies
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=Strict

# Logging para debugging
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.postgresql=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.lectuaria.backend.service.storage=DEBUG

# Multipart limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Frontend URL
frontend.url=${FRONTEND_URL:http://localhost:5173}
# Platform name for emails
platform.name=Lectuaria

# ============================================
# Supabase Storage (S3-compatible)
# ============================================
aws.s3.endpoint=${AWS_S3_ENDPOINT}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:book-covers}
aws.s3.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY}

# ============================================
# Email Configuration (SMTP)
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true